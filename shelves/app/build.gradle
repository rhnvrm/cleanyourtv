plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('io.github.tvhomeshelves.launcher')
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.2.0-shelves'
    }

    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    signingConfigs {
        if (signingFile.exists()) {
            personalRelease {
                storeFile rootProject.file(signingValues.getProperty('storeFile'))
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release signing is explicit. Without a local signing.properties the release APK is unsigned.
            if (signingFile.exists()) signingConfig signingConfigs.personalRelease
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
